name: Build and verify
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-26.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: ubuntu-26.04
            goos: freebsd
            goarch: amd64
          - runner: windows-2025
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Install GNU make
        if: matrix.goos == 'windows'
        shell: bash
        run: choco install make --no-progress -y
      - name: Verify native runner architecture
        if: matrix.goos != 'freebsd'
        shell: bash
        run: test "$(go env GOOS)/$(go env GOARCH)" = '${{ matrix.goos }}/${{ matrix.goarch }}'
      - run: make check
        shell: bash
      - if: matrix.goos != 'freebsd'
        shell: bash
        run: make build REPOSITORY='https://github.com/${{ github.repository }}'
      - name: Install FreeBSD cross-compilation tools
        if: matrix.goos == 'freebsd'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld binutils xz-utils
      - name: Cross-build FreeBSD AMD64 (no VM)
        if: matrix.goos == 'freebsd'
        env:
          REPOSITORY: https://github.com/${{ github.repository }}
        run: ./scripts/build-freebsd.sh
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/**/*.so
            dist/**/*.dylib
            dist/**/*.dll
          if-no-files-found: error

  goreleaser-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> 2"
          args: check
